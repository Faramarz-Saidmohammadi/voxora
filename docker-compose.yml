services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: voxora
      POSTGRES_USER: voxora
      POSTGRES_PASSWORD: voxora
    ports:
      - "5432:5432"
    volumes:
      - voxora-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxora -d voxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - voxora-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voxora-postgres:
  voxora-redis:
